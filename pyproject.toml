[build-system]
requires      = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name             = "fastapi-gnitz"
version          = "0.1.0"
description      = "FastAPI integration for Gnitz, a SQL database whose views are all materialized and incrementally updated"
readme           = "README.md"
requires-python  = ">=3.14"
license          = "MIT OR Apache-2.0"
license-files    = ["LICENSE-APACHE", "LICENSE-MIT"]
authors          = [{ name = "Christian Schramm" }]
keywords         = ["fastapi", "gnitz", "database", "sql", "materialized-views"]
classifiers      = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies     = [
    "annotated-types>=0.7",
    "fastapi>=0.115",
    "gnitz>=0.1.4",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths     = ["tests"]
asyncio_mode  = "auto"
xfail_strict  = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
